server:
  port: 8080

spring:
  # 默认激活 local 环境，加载本机（git 忽略）的 application-local.yml 中的敏感配置
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist=true：首次运行自动创建 hrms 数据库
    url: jdbc:mysql://localhost:3306/hrms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    # 密码不写死在本文件，见 application-local.yml 或环境变量 DB_PASSWORD
    password: ${DB_PASSWORD:}
  sql:
    init:
      # 每次启动执行 schema.sql（脚本为幂等，可重复执行）
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: utf-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  configuration:
    # 数据库下划线命名 -> Java 驼峰命名 自动映射
    map-underscore-to-camel-case: true
  type-aliases-package: com.hrms.entity

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# JWT 配置（实验四）：签名密钥不写死在本文件，见 application-local.yml 或环境变量 JWT_SECRET
jwt:
  secret: ${JWT_SECRET:}
  # 令牌有效期（毫秒），默认 1 天
  expiration: 86400000
